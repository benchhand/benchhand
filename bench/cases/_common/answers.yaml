# Answers every case shares: gates, workflow and setup questions. A case's own answers.yaml lists
# its intents first, so a case-specific intent wins over these when both match one ask.
default: >-
  I have no further information on that. Use your recommended option, record it as a bounded
  assumption in a decision record, and continue.
nudge: Continue with the next step of the flow.
wait_s: {question: 180, gate: 600, nudge: 30}
stop: {fixture: layout-freeze, bench: parts-gate}
intents:
  # --- gates -------------------------------------------------------------------------------
  - id: parts-gate
    kind: gate
    match: ['PARTS (human )?gate', 'approve (the )?(L2|PARTS)\b', 'approve\b.*\bv\d+\b.*\b(L2|PARTS)\b']
    answer: >-
      PARTS gate: approved. I accept any unproved between-sample intervals the full sweep reported;
      record that acceptance in its own decision record and cite it from the approval.
  - id: layout-freeze
    kind: gate
    match: ['LAYOUT freeze', 'freeze (the )?(L1 )?layout', 'approve (the )?(L1 )?layout', 'approve\b.*\bv\d+\b.*\b(L1|LAYOUT)\b']
    answer: >-
      LAYOUT freeze: approved. I accept any unproved between-sample intervals the full sweep
      reported; record that acceptance in its own decision record and cite it from the approval.
  - id: variant-gate
    kind: gate
    match: ['VARIANT gate', '\b(select|choose|pick|prefer)\b.*\b(variant|concept)', '\bwhich (variant|concept)']
    answer: I select the variant you recommend. VARIANT gate approved.
  - id: intent-gate
    kind: gate
    match: ['(?-i:\bINTENT\b)', 'approve\b.*\b(selection|route|material|process)', '\b(selection|route)\b.*\bapprov']
    answer: >-
      I approve the recommended material and process selection for every part, as assessed.
      INTENT gate approved.
  - id: specify-approval
    kind: gate
    match: ['(?-i:\bSPECIFY\b)', 'approve\b.*\b(requirements|specification|interfaces)']
    answer: The requirements, interfaces and evidence obligations are approved as proposed.
  - id: between-sample
    kind: question
    match: ['between-sample', 'unproved interval', 'finer (run|sweep)']
    answer: Accept the unproved between-sample intervals and record the acceptance in a decision record.
  # --- workflow and setup ------------------------------------------------------------------
  - id: flow-profile
    kind: question
    profile: true
    match: ['flow[ ._-]?profile', '\b(workflow|process|stage) profile\b']
    answer: Use the default flow profile, with every stage and gate of the documented flow.
  - id: storage
    kind: question
    match: ['results_in_git', 'results? (be )?(stored|kept|tracked) in git', 'generated results', '\bLFS\b',
            'store\b.*\b(STEP|GLB|renders)\b.*\bgit']
    answer: 'Do not store generated results in git: set storage.results_in_git to false.'
  - id: commit
    kind: question
    match: ['\bcommit\b']
    answer: Commit the batch.
  - id: setup
    kind: question
    match: ['setup\.py', '--yes', 'install\b.*\b(FreeCAD|Chromium|playwright|harness)', '\bwarm']
    answer: Yes, run setup with --yes. FreeCAD 1.1.4 is installed.
  - id: hook
    kind: question
    match: ['\bhook\b', 'stamp\.py']
    answer: Install the recheck hook if it installs; otherwise verify each commit with stamp.py as documented.
  - id: viewer
    kind: question
    match: ['\b(viewer|preview|gallery)\b.*\b(look|review|open|check|feedback)', '\bfeedback\b', 'any changes']
    answer: I reviewed the previews; no changes. Proceed.
  - id: kernel
    kind: question
    match: ['\bkernel\b', '\bcadquery\b', '\bbuild123d\b']
    answer: Use the default kernel choice (auto).
  - id: regime
    kind: question
    match: ['\bISO\b.*\bASME\b', '\bASME\b.*\bISO\b', '\bregime\b', '\bprojection\b', 'drawing standard']
    answer: ISO, first-angle projection, general tolerances ISO 2768-m, millimetres.
  - id: sourcing
    kind: question
    match: ['\bsupplier\b', '\bvendor\b', '\bdistributor\b', 'where.*\b(buy|order)\b']
    answer: >-
      No preferred supplier. Use common European or global catalogue distributors and order
      standard parts by their standard designation.
  - id: proceed
    kind: question
    match: ['\b(shall|should|may|can) I (proceed|continue|start|go ahead)', '\bproceed\?', '\bgo ahead\?',
            '\bready to (proceed|continue|start)']
    answer: Yes, proceed.
  # --- GROUND slots: shared patterns, answered by each case's `slots` --------------------------
  # Listed most specific first; a case that leaves a slot out gets the default answer.
  - id: service-class
    match: ['service[ _]class', '\bprototype\b', '\bend[- ]use\b', '\bproduction\b', '\bdemonstrat', 'fit[ /-]assembly',
            'appearance (model|concept)', 'intended (service|use)\b.*\b(class|maturity)']
  - id: rigor
    match: ['\brigou?r\b', '\bmaker\b', '\bregulated\b', 'documentation depth']
  - id: release-scope
    match: ['\brelease\b.*\b(claim|scope|include|contain)', '\bwhat may\b', 'operating limits', '\bexclusions\b',
            'evidence\b.*\b(need|required|scope)']
  - id: pn-prefix
    match: ['part[- ]number', '\bPN\b', '\bprefix\b', '\bnaming\b', '\bproduct id\b']
  - id: equipment
    match: ['\bprinters?\b', '\bequipment\b', '\bmachines?\b', '\bbureau\b', '\boutsourc', '\bin-house\b', '\bcapabilit',
            '\bnozzle\b', 'build (volume|plate|envelope)', '\bstock\b', '\boperators?\b', '\bcalibrat', '\bslicer\b',
            '\bmeasur(e|ing|ement)\b.*\b(capabilit|equipment|tools?)']
  - id: material
    match: ['\bmaterials?\b', '\bPETG\b', '\bPLA\b', '\bABS\b', '\bASA\b', '\balumin(i)?um\b', '\bfilament\b', '\bgrade\b',
            '\balloy\b', '\bsteel\b']
  - id: mass
    match: ['\bmass\b', 'weight (target|limit|budget)', 'how heavy']
  - id: loads
    match: ['\bloads?\b', '\bloading\b', '\bforces?\b', '\bweight\b', '\bimpact\b', '\bvibration\b', '\bcyclic\b',
            '\bsustained\b', 'safety factor', '\bstiffness\b', '\bdeflection\b', '\bstrength\b', '\btorque\b']
  - id: motion
    match: ['\bmotion\b', '\bduty\b', '(service )?life\b', '\bcycles?\b', '\bwear\b', '\bfriction\b', '\bspeed\b',
            '\btravel\b', 'range of (motion|travel)', '\bmov(e|es|ing)\b']
  - id: clearance
    match: ['\bclearances?\b', '\bgap\b', '\bplay\b', '\bfit\b']
  - id: environment
    match: ['\btemperature', '\bheat\b', '\bmoisture\b', '\bhumid', '\bUV\b', '\boutdoors?\b', '\bindoors?\b', '\bchemical',
            '\bcorrosi', '\benvironment']
  - id: accuracy
    match: ['\baccura', '\brepeatab', '\bfinish\b', '\btolerances?\b', 'dimensional stability', '\bsurface\b']
  - id: consequences
    match: ['\bconsequence', '\bfail(ure|s)?\b', '\bstandards?\b', '\bsafety\b', '\bregulat', 'who (supervises|approves|signs)',
            '\bforbidden\b', '\bhazard']
  - id: quantity
    match: ['\bquantit', '\bhow many\b', '\bbudget\b', '\bcost\b', 'lead time', '\bdeadline\b', 'batch size']
  - id: maintenance
    match: ['\bmaint', '\brepair', '\bservic(ing|eable)\b', '\bdisassembl', '\breplac(e|ing|ement)\b']
  - id: appearance
    match: ['\bcolou?r\b', '\bappearance\b', '\baesthetic', '\bstyl(e|ing)\b']
  - id: purpose
    match: ['\bpurpose\b', '\bwho\b.*\buse', '\busers?\b', 'what (must|should|does|will) (it|the \w+) do', '\bwhere\b.*\bused\b',
            '\buse case\b']

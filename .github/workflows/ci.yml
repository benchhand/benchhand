name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A pull request's newer push replaces its older run; every push to main keeps its own run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Harness, generated files and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: scripts/typecheck.py.lock

      - name: Harness tests
        run: uv run --no-project --with pyyaml==6.0.3 python -B -m unittest discover -s harness -p 'test_*.py'

      - name: Generated files
        run: uv run --no-project --with pyyaml==6.0.3 python -B harness/generate.py --check

      - name: Scoped Python type check
        run: uv run --no-project --locked --script scripts/typecheck.py

  skills:
    name: Skill tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [motion, cad-model, record, freecad-gated, rest]
    env:
      FREECAD_APPIMAGE: FreeCAD_1.1.4-Linux-x86_64-py311.AppImage
      FREECAD_RELEASE: https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4
      FREECAD_DIR: ${{ github.workspace }}/../freecad-1.1.4
      # One interpreter for every script environment: the pair cache's rule identity includes the
      # Python and numpy versions, so tools that share it must run on the same build.
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-managed
      # Every shard installs FreeCAD, so a FreeCAD test that cannot find it fails instead of skipping.
      CAD_REQUIRE_FREECAD: "1"
      # A file named here runs only in its shard. The rest shard runs every other test file.
      SHARDS: |
        motion skills/cad-motion/tests/test_motion.py
        cad-model skills/cad-model/tests/test_cad_model.py
        record skills/cad-record/tests/test_release.py
        record skills/cad-record/tests/test_validate.py
        freecad-gated skills/cad-analysis/tests/test_fea_static.py
        freecad-gated skills/cad-design/tests/test_design.py
        freecad-gated skills/cad-drawings/tests/test_assembly_end_to_end.py
        freecad-gated skills/cad-drawings/tests/test_drawing.py
        freecad-gated skills/cad-drawings/tests/test_drawing_framework.py
        freecad-gated skills/cad-drawings/tests/test_feature_recognition.py
        freecad-gated skills/cad-drawings/tests/test_part_drawings.py
        freecad-gated skills/cad-drawings/tests/test_section_hatch.py
        freecad-gated skills/cad-flow/tests/test_scratch.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect PEP 723 dependency headers
        run: |
          python3 - > skills-pep723-headers.txt <<'PY'
          import re
          import subprocess

          block = re.compile(r"(?m)^# /// script$\s(?P<content>(^#(| .*)$\s)+)^# ///$")
          files = subprocess.run(
              ["git", "ls-files", "-z", "skills/*.py", "skills/**/*.py"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout
          headers = {
              match["content"]
              for path in files.split("\0")
              if path
              for match in block.finditer(open(path, encoding="utf-8").read())
          }
          print("".join(sorted(headers)), end="")
          PY

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: skills-pep723-headers.txt

      - name: Drop script environments restored from the uv cache
        # A restored environment keeps the versions it was resolved with; a new one gets today's.
        run: rm -rf -- "$(uv cache dir)/environments-v2"

      - name: Cache the FreeCAD AppImage
        id: freecad-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.FREECAD_DIR }}/download
          key: freecad-${{ env.FREECAD_APPIMAGE }}

      - name: Download the FreeCAD AppImage
        if: steps.freecad-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$FREECAD_DIR/download"
          curl --fail --location --silent --show-error --retry 3 --output-dir "$FREECAD_DIR/download" \
            --remote-name "$FREECAD_RELEASE/$FREECAD_APPIMAGE" \
            --remote-name "$FREECAD_RELEASE/$FREECAD_APPIMAGE-SHA256.txt"

      - name: Verify the FreeCAD AppImage
        working-directory: ${{ env.FREECAD_DIR }}/download
        run: sha256sum --check "$FREECAD_APPIMAGE-SHA256.txt"

      - name: Install FreeCAD 1.1.4
        working-directory: ${{ env.FREECAD_DIR }}
        run: |
          chmod +x "download/$FREECAD_APPIMAGE"
          "download/$FREECAD_APPIMAGE" --appimage-extract > /dev/null
          mkdir -p ~/.local/bin
          ln -sfn "$PWD/squashfs-root/usr/bin/freecadcmd" ~/.local/bin/freecadcmd
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/freecadcmd --version | tee version.txt
          grep -q 'FreeCAD 1\.1\.4' version.txt

      - name: Measure env build (ENVBUILD)
        run: |
          envdir="$(uv cache dir)/environments-v2"
          echo "ENVDIR_COUNT_BEFORE_BUILD $(ls "$envdir" 2>/dev/null | wc -l)"
          total=0
          while IFS= read -r -d '' f; do
            grep -q '^# /// script$' "$f" || continue
            s=$SECONDS
            uv sync --script "$f" > /dev/null 2>&1 || echo "ENVBUILD_FAILED $f"
            e=$((SECONDS - s)); total=$((total + e))
            echo "ENVBUILD $e $f"
          done < <(git ls-files -z 'skills/*.py')
          echo "ENVBUILD_TOTAL $total"
          echo "ENVDIR_COUNT_AFTER_BUILD $(ls "$envdir" | wc -l)"

      - name: Skill tests (run 1, warm envs)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t tracked < <(git ls-files 'skills/*/test_*.py' 'skills/*/tests/test_*.py')
          mapfile -t named < <(awk 'NF { print $2 }' <<< "$SHARDS")
          for test in "${named[@]}"; do
            if ! printf '%s\n' "${tracked[@]}" | grep -qxF "$test"; then
              echo "::error::$test is in SHARDS but is not a tracked test file"
              exit 1
            fi
          done
          if [ "$SHARD" = rest ]; then
            mapfile -t files < <(printf '%s\n' "${tracked[@]}" | grep -vxF -f <(printf '%s\n' "${named[@]}"))
          else
            mapfile -t files < <(awk -v shard="$SHARD" '$1 == shard { print $2 }' <<< "$SHARDS")
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::shard $SHARD has no test files"
            exit 1
          fi

          failed=0
          printf '| Result | Seconds | Test file |\n|---|---:|---|\n' >> "$GITHUB_STEP_SUMMARY"
          for test in "${files[@]}"; do
            echo "::group::$test"
            started=$SECONDS
            result=pass
            uv run --no-project --with pyyaml==6.0.3 --with jsonschema==4.26.0 --with defusedxml==0.7.1 \
              python -B -m unittest discover -s "$(dirname "$test")" -p "$(basename "$test")" || result=FAIL
            echo "::endgroup::"
            elapsed=$((SECONDS - started))
            if [ "$result" = FAIL ]; then
              failed=$((failed + 1))
              echo "::error file=$test::$test failed"
            fi
            echo "$result ${elapsed}s $test"
            echo "| $result | $elapsed | \`$test\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "$failed of ${#files[@]} test files failed in shard $SHARD"
          [ "$failed" -eq 0 ]
          echo "ENVDIR_COUNT_AFTER_WARM_TESTS $(ls "$(uv cache dir)/environments-v2" | wc -l)"

      - name: Wipe envs
        run: rm -rf -- "$(uv cache dir)/environments-v2"

      - name: Skill tests (run 2, cold envs, warm wheels)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t tracked < <(git ls-files 'skills/*/test_*.py' 'skills/*/tests/test_*.py')
          mapfile -t named < <(awk 'NF { print $2 }' <<< "$SHARDS")
          for test in "${named[@]}"; do
            if ! printf '%s\n' "${tracked[@]}" | grep -qxF "$test"; then
              echo "::error::$test is in SHARDS but is not a tracked test file"
              exit 1
            fi
          done
          if [ "$SHARD" = rest ]; then
            mapfile -t files < <(printf '%s\n' "${tracked[@]}" | grep -vxF -f <(printf '%s\n' "${named[@]}"))
          else
            mapfile -t files < <(awk -v shard="$SHARD" '$1 == shard { print $2 }' <<< "$SHARDS")
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::shard $SHARD has no test files"
            exit 1
          fi

          failed=0
          printf '| Result | Seconds | Test file |\n|---|---:|---|\n' >> "$GITHUB_STEP_SUMMARY"
          for test in "${files[@]}"; do
            echo "::group::$test"
            started=$SECONDS
            result=pass
            uv run --no-project --with pyyaml==6.0.3 --with jsonschema==4.26.0 --with defusedxml==0.7.1 \
              python -B -m unittest discover -s "$(dirname "$test")" -p "$(basename "$test")" || result=FAIL
            echo "::endgroup::"
            elapsed=$((SECONDS - started))
            if [ "$result" = FAIL ]; then
              failed=$((failed + 1))
              echo "::error file=$test::$test failed"
            fi
            echo "$result ${elapsed}s $test"
            echo "| $result | $elapsed | \`$test\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "$failed of ${#files[@]} test files failed in shard $SHARD"
          echo "ENVS_USED_START"
          for d in "$(uv cache dir)/environments-v2"/*; do
            echo "ENVPKGS $(basename "$d") $(ls "$d"/lib/python*/site-packages | grep -E '\.dist-info$' | sed 's/\.dist-info$//' | tr '\n' ' ')"
          done
          [ "$failed" -eq 0 ]
